<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuzzy Wire Options - MelianCustomCrafts</title>
    <style>
        /* CSS Reset & Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-color: #d81b60;
            --primary-hover: #ad1457;
            --bg-color: #fff5f7;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem 1rem 3rem;
        }

        /* Navigation Bar */
        .nav-container {
            max-width: 1000px;
            margin: 0 auto 1.5rem;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            background: #fff;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        /* Header Section */
        header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 2.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: #666;
            font-size: 1.05rem;
        }

        /* Categories Grid */
        .craft-grid {
            max-width: 900px;
            margin: 0 auto 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        /* Interactive Category Cards */
        .craft-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            border: 2px solid transparent;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .craft-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 20px rgba(216, 27, 96, 0.15);
        }

        .craft-icon {
            font-size: 2.8rem;
            margin-bottom: 1rem;
        }

        .craft-card h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #222;
        }

        /* Order CTA Card */
        .cta-card {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .cta-card h3 {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .cta-card p {
            color: #666;
            margin-bottom: 1.2rem;
        }

        .btn-order {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.25);
            transition: all 0.3s ease;
        }

        .btn-order:hover {
            background-color: var(--primary-hover);
            transform: scale(1.03);
            box-shadow: 0 6px 16px rgba(216, 27, 96, 0.35);
        }
    </style>
</head>
<body>

    <!-- Back Button -->
    <div class="nav-container">
        <a href="../index.html" class="btn-back">← Back to Home</a>
    </div>

    <!-- Page Header -->
    <header>
        <h1>Fuzzy Wire Creations</h1>
        <p>Explore our handmade pipe cleaner bouquets, ties, and accessories</p>
    </header>

    <!-- Category Option Cards -->
    <main class="craft-grid">

        <a href="inside/bouquet.html" class="craft-card">
            <span class="craft-icon">💐</span>
            <h2>Fuzzy Wire Bouquet</h2>
        </a>

        <a href="inside/curtain.html" class="craft-card">
            <span class="craft-icon">🎗️</span>
            <h2>Curtain Tie</h2>
        </a>

        <a href="inside/keychain.html" class="craft-card">
            <span class="craft-icon">🔑</span>
            <h2>Fuzzy Wire Keychain</h2>
        </a>

    </main>

    <!-- Order CTA -->
    <div class="cta-card">
        <h3>Found something you like?</h3>
        <p>Send us a message on Facebook to place your order or customize colors!</p>
        <a href="https://www.facebook.com/profile.php?id=61576467142168" target="_blank" class="btn-order">
            Order Here on Facebook
        </a>
    </div>

</body>
</html>
