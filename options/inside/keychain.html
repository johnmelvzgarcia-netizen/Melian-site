    <style>
        /* CSS Reset & Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-color: #d81b60;
            --primary-hover: #ad1457;
            --bg-color: #fff5f7;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem 1rem 3rem;
        }

        /* Navigation Links */
        .nav-container {
            max-width: 1000px;
            margin: 0 auto 1.5rem;
            display: flex;
            gap: 0.75rem;
        }

        .btn-nav {
            display: inline-flex;
            align-items: center;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            background: #fff;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
        }

        .btn-nav:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        /* Header Section */
        header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 2.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: #666;
            font-size: 1.05rem;
        }

        /* Product Gallery Grid */
        .product-grid {
            max-width: 900px;
            margin: 0 auto 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Product Cards */
        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(216, 27, 96, 0.15);
        }

        .product-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-bottom: 3px solid var(--bg-color);
        }

        .product-content {
            padding: 1.25rem;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-title {
            font-size: 1.15rem;
            color: #222;
            font-weight: 600;
        }

        /* Order Section */
        .cta-card {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .cta-card h3 {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .cta-card p {
            color: #666;
            margin-bottom: 1.2rem;
        }

        .btn-order {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.25);
            transition: all 0.3s ease;
        }

        .btn-order:hover {
            background-color: var(--primary-hover);
            transform: scale(1.03);
            box-shadow: 0 6px 16px rgba(216, 27, 96, 0.35);
        }
    </style>
</head>
